<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAA Wallet Pass Viewer</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f2f4f7;margin:0;color:#202124}.top{background:#123d78;color:#fff;padding:24px calc((100% - 900px)/2)}main{max-width:900px;margin:24px auto}.tabs button,button{padding:10px 14px;border:1px solid #ccd5e0;border-radius:8px;background:#fff;cursor:pointer}.tabs .active,button.active{background:#0c72df;color:#fff}.grid{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-top:20px}.phone{background:#111827;border:8px solid #111827;border-radius:38px;padding:10px}.screen{background:#f7f5f1;border-radius:27px;overflow:hidden;min-height:600px}.art{height:290px;background:center/cover no-repeat;position:relative}.brand,.title{position:absolute;top:18px;color:#fff;font-weight:700}.brand{left:18px}.title{right:18px;text-align:right}.title small{display:block;font-weight:400}.fields{background:#fff;margin:-2px 12px 12px;border-radius:14px;padding:16px;position:relative}.field{display:flex;justify-content:space-between;margin:8px 0}.field label{font-size:10px;color:#707070;text-transform:uppercase}.field strong{font-size:12px}.barcode{height:54px;margin:16px auto 0;max-width:210px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px)}.actions{display:flex;gap:10px;padding:0 12px 14px}.action{background:#fff;border-radius:12px;padding:14px 8px;text-align:center;flex:1;font-size:12px}.action b{display:block;color:#0c72df;margin-bottom:6px}.panel{background:#fff;border:1px solid #dbe2ea;border-radius:12px;padding:20px}.json{display:none;background:#111827;color:#d1fae5;padding:16px;overflow:auto;max-height:620px;font:12px monospace;white-space:pre-wrap}.drop{margin-top:18px;border:2px dashed #ccd5e0;padding:16px;text-align:center;color:#64748b}@media(max-width:800px){main{margin:20px}.grid{grid-template-columns:1fr}.phone{max-width:380px;margin:auto}}</style>
<header class="top"><h1>AAA Wallet Pass Viewer</h1><div>Design preview and pass.json inspection</div></header><main><nav class="tabs"><button class="active" data-p="membership">Membership Card</button> <button data-p="insurance">Insurance Card</button></nav><section class="grid"><div class="phone"><div class="screen"><div class="art" id="art"><span class="brand">AAA</span><span class="title" id="title"></span></div><div class="fields" id="fields"></div><div class="actions"><div class="action"><b>☎</b>Roadside Assistance</div><div class="action"><b>⌖</b>Nearest Branch</div></div></div></div><div class="panel"><button class="active" id="pv">Preview</button> <button id="js">pass.json</button><div id="preview"><h2 id="name"></h2><p id="summary"></p><div class="drop">Inspect another pass.json:<br><input id="file" type="file" accept=".json,application/json"></div></div><pre class="json" id="json"></pre></div></section></main>
<script>
const d={membership:{name:'AAA Membership Card',art:'templates/AAA Membership Card.pkpasstemplate/artwork@3x.png',json:'templates/AAA Membership Card.pkpasstemplate/pass.json'},insurance:{name:'AAA Insurance Card',art:'templates/AAA Insurance Card.pkpasstemplate/artwork@3x.png',json:'templates/AAA Insurance Card.pkpasstemplate/pass.json'}};let key='membership';const $=x=>document.getElementById(x);function show(x){const g=x.posterGeneric||{};$('art').style.backgroundImage=`url(${d[key].art})`;$('title').innerHTML=(g.headerFields||[]).map(f=>f.value+'<small>'+f.label+'</small>').join('');$('name').textContent=d[key].name;$('summary').textContent=(x.featuredActions||[]).length+' Featured Actions · '+(g.backFields||[]).length+' back fields';$('fields').innerHTML=(g.primaryFields||[]).map(f=>'<div class="field"><label>'+f.label+'</label><strong>'+f.value+'</strong></div>').join('')+'<div class="barcode"></div>';$('json').textContent=JSON.stringify(x,null,2)}async function load(){show(await (await fetch(d[key].json)).json())}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');key=b.dataset.p;load()});$('pv').onclick=()=>{$('preview').style.display='block';$('json').style.display='none';$('pv').classList.add('active');$('js').classList.remove('active')};$('js').onclick=()=>{$('preview').style.display='none';$('json').style.display='block';$('js').classList.add('active');$('pv').classList.remove('active')};$('file').onchange=async e=>{const f=e.target.files[0];if(f)show(JSON.parse(await f.text()))};load();
</script>
