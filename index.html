<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet Pass Inspector</title><style>
body{margin:0;background:#eef1f5;color:#172033;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#16365d;color:white;padding:24px calc((100% - 1160px)/2)}.top h1{margin:0 0 5px}.wrap{max-width:1160px;margin:20px auto;padding:0 18px}.bar,.panel{background:white;border:1px solid #d7e0ea;border-radius:12px;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar button,.bar label{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}.bar .on{background:#0c72df;color:white;border-color:#0c72df}.bar input{display:none}.grid{display:grid;grid-template-columns:430px 1fr;gap:22px;margin-top:20px}.device{perspective:1000px}.card{min-height:650px;position:relative;transform-style:preserve-3d;transition:.6s}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.back{transform:rotateY(180deg)}.phone{background:#111827;border:9px solid #111827;border-radius:40px;padding:10px;min-height:630px;box-shadow:0 15px 35px #0003}.screen{background:#f7f5f1;border-radius:28px;overflow:hidden;min-height:610px}.hero{height:285px;background:center/cover;position:relative}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,transparent 45%,#0002)}.brand,.heroTitle{position:absolute;z-index:1;top:18px;color:#fff;font-weight:700}.brand{left:18px}.heroTitle{right:18px;text-align:right}.heroTitle small{display:block;font-weight:400;font-size:11px}.fields{background:#fff;border-radius:14px;margin:-2px 12px 12px;padding:14px;position:relative}.field{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.field label{font-size:10px;color:#707070;text-transform:uppercase}.field strong{font-size:12px;text-align:right}.barcode{height:52px;max-width:210px;margin:16px auto 0;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px)}.actions{display:flex;gap:8px;padding:0 12px 14px}.action{background:white;border-radius:12px;padding:12px 6px;text-align:center;flex:1;font-size:12px}.action b{display:block;color:#0c72df;font-size:20px}.backScreen{padding:25px 19px;background:#f7f5f1;min-height:560px}.backScreen h3{text-align:center}.backField{border-top:1px solid #d6dbe1;padding:11px 0;white-space:pre-line;font-size:12px}.backField b{display:block;font-size:10px;margin-bottom:4px}.panel h2{margin:0 0 7px}.muted{color:#64748b;font-size:13px}.section{border-top:1px solid #e2e8f0;margin-top:15px;padding-top:13px}.section h3{margin:0 0 8px;font-size:14px}.actionRow{border:1px solid #d7e0ea;border-radius:8px;padding:9px;margin:6px 0}.actionRow strong{color:#0c72df}.actionRow code{display:block;word-break:break-all;color:#64748b;font-size:11px;margin-top:4px}.json{background:#101827;color:#c7f9d4;padding:14px;border-radius:8px;max-height:390px;overflow:auto;font:11px monospace;white-space:pre-wrap}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.device{max-width:430px;margin:auto}}
</style></head><body><header class="top"><h1>Wallet Pass Inspector</h1><div>Read-only Apple Wallet template preview and metadata</div></header><main class="wrap"><div class="bar"><button class="on" data-pass="membership">Membership</button><button data-pass="insurance">Insurance</button><label>Import pass.json<input id="jsonFile" type="file" accept=".json,application/json"></label><label>Import template folder<input id="folder" type="file" webkitdirectory multiple></label><button id="front" class="on">Front</button><button id="details">Back / Details</button><button id="rotate">Rotate</button><button id="ios27" class="on">iOS 27</button><button id="ios26">iOS 26</button></div><section class="grid"><div class="device"><div id="card" class="card"><div class="face"><div class="phone"><div class="screen"><div id="hero" class="hero"><span class="brand">AAA</span><span id="heroTitle" class="heroTitle"></span></div><div id="fields" class="fields"></div><div id="actions" class="actions"></div></div></div></div><div class="face back"><div class="phone"><div id="back" class="backScreen"></div></div></div></div></div><div class="panel"><h2 id="name"></h2><div id="meta" class="muted"></div><div class="section"><h3>Featured Actions</h3><div id="actionList"></div><div class="muted">Wallet selects the icon and localized label from the supported action type.</div></div><div class="section"><h3>Complete pass.json metadata</h3><pre id="json" class="json"></pre></div></div></section></main><script>
const built={membership:{name:'AAA Membership Card',json:'templates/AAA Membership Card.pkpasstemplate/pass.json',art:'templates/AAA Membership Card.pkpasstemplate/artwork@3x.png'},insurance:{name:'AAA Insurance Card',json:'templates/AAA Insurance Card.pkpasstemplate/pass.json',art:'templates/AAA Insurance Card.pkpasstemplate/artwork@3x.png'}};let key='membership',pass,art;const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),info={call:['☎','Call'],place:['⌖','Go to Location'],membershipBenefits:['★','View Membership Benefits'],shop:['▣','Shop Online or In-App'],order:['▰','Order Delivery or Pickup'],bookAppointment:['◷','Book an Appointment'],viewOffersRewards:['★','View Offers & Rewards'],bookCar:['▣','Book a Car'],bookFlight:['✈','Book a Flight'],bookStay:['⌂','Book a Stay'],viewSchedule:['◷','View Schedule'],watchTrailer:['▶','Watch Trailer'],listenToMusic:['♫','Listen to Music'],addToBalance:['＋','Add to Balance']};
function render(){let g=pass.posterGeneric||pass.generic||{},a=pass.featuredActions||[];$('#hero').style.backgroundImage=`url(${art||built[key].art})`;$('#name').textContent=pass.description||built[key].name;$('#meta').textContent='Style: '+(pass.posterGeneric?'Poster Generic':'Generic')+' · Format '+pass.formatVersion+' · '+a.length+' Featured Actions';$('#heroTitle').innerHTML=(g.headerFields||[]).map(f=>esc(f.value)+'<small>'+esc(f.label)+'</small>').join('');$('#fields').innerHTML=(g.primaryFields||[]).map(f=>'<div class="field"><label>'+esc(f.label)+'</label><strong>'+esc(f.value)+'</strong></div>').join('')+'<div class="barcode"></div>';$('#actions').innerHTML=a.map(x=>{let i=info[x.type]||['●',x.type];return '<div class="action"><b>'+i[0]+'</b>'+esc(i[1])+'</div>'}).join('');$('#actionList').innerHTML=a.map(x=>{let i=info[x.type]||['●',x.type],dest=x.url||('placeIdentifier: '+(x.placeIdentifier||''));return '<div class="actionRow"><strong>'+i[0]+' '+esc(i[1])+'</strong><br><small>identifier: '+esc(x.identifier)+' · type: '+esc(x.type)+'</small><code>'+esc(dest)+'</code></div>'}).join('')||'<span class="muted">No Featured Actions</span>';$('#back').innerHTML='<h3>Pass Details</h3>'+(g.backFields||[]).map(f=>'<div class="backField"><b>'+esc(f.label)+'</b>'+esc(f.value)+'</div>').join('');$('#json').textContent=JSON.stringify(pass,null,2)}async function load(){pass=await(await fetch(built[key].json)).json();art=null;render()}document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pass]').forEach(x=>x.classList.remove('on'));b.classList.add('on');key=b.dataset.pass;load()});$('#rotate').onclick=()=>$('#card').classList.toggle('flip');$('#front').onclick=()=>{$('#card').classList.remove('flip');$('#front').classList.add('on');$('#details').classList.remove('on')};$('#details').onclick=()=>{$('#card').classList.add('flip');$('#details').classList.add('on');$('#front').classList.remove('on')};$('#ios27').onclick=()=>{$('#ios27').classList.add('on');$('#ios26').classList.remove('on')};$('#ios26').onclick=()=>{$('#ios26').classList.add('on');$('#ios27').classList.remove('on')};$('#jsonFile').onchange=async e=>{if(e.target.files[0]){pass=JSON.parse(await e.target.files[0].text());art=null;render()}};$('#folder').onchange=async e=>{let f=[...e.target.files],j=f.find(x=>x.name==='pass.json');if(!j)return alert('Select a .pkpasstemplate folder containing pass.json.');pass=JSON.parse(await j.text());let image=f.find(x=>/artwork@3x\.png$/.test(x.name));art=image?URL.createObjectURL(image):null;render()};load();</script></body></html>
