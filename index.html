<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAA Wallet Pass Inspector</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef1f5}*{box-sizing:border-box}body{margin:0}.top{background:#17365d;color:#fff;padding:22px max(20px,calc((100vw - 1160px)/2))}.top h1{font-size:24px;margin:0 0 5px}.top p{margin:0;color:#d9e7f7}.wrap{max-width:1160px;margin:20px auto;padding:0 18px}.toolbar,.panel{background:white;border:1px solid #d8e1eb;border-radius:10px;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button,.toolbar label{font:inherit;font-size:14px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:9px 12px;cursor:pointer}.toolbar button.active{background:#0c72df;color:#fff;border-color:#0c72df}.toolbar input{display:none}.grid{display:grid;grid-template-columns:minmax(350px,430px) minmax(0,1fr);gap:22px;margin-top:20px}.device{perspective:1100px;touch-action:pan-y}.card{min-height:660px;position:relative;transform-style:preserve-3d;transition:transform .55s}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.back{transform:rotateY(180deg)}.phone{background:#111827;border:9px solid #111827;border-radius:40px;padding:10px;min-height:640px;box-shadow:0 14px 36px #0003}.screen{background:#f7f5f1;border-radius:28px;overflow:hidden;min-height:620px}.hero{height:290px;background:#cbd5e1 center/cover no-repeat;position:relative}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0005,transparent 45%,#0001)}.brand,.heroTitle{position:absolute;top:17px;z-index:1;color:white;font-weight:700}.brand{left:18px}.heroTitle{right:18px;text-align:right;font-size:14px}.heroTitle small{display:block;font-size:11px;font-weight:400;margin-top:3px}.fields{position:relative;background:white;border-radius:14px;margin:-2px 12px 12px;padding:14px}.field{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.field label{font-size:9px;color:#707070;text-transform:uppercase}.field strong{font-size:12px;text-align:right}.barcode{height:54px;max-width:230px;margin:16px auto 3px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 7px,#fff 7px 10px)}.actions{display:flex;gap:9px;padding:0 12px 14px}.action{flex:1;text-align:center;border-radius:12px;background:white;padding:12px 6px;font-size:12px}.action b{display:block;color:#0c72df;font-size:19px;margin-bottom:4px}.backScreen{padding:24px 18px;background:#f7f5f1;min-height:620px}.backScreen h3{text-align:center;margin:4px 0 17px}.backField{border-top:1px solid #d9dce0;padding:10px 0;font-size:12px;white-space:pre-line}.backField b{display:block;font-size:10px;margin-bottom:4px}.panel h2{font-size:18px;margin:0 0 6px}.muted{font-size:13px;color:#64748b}.section{border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px}.section h3{font-size:14px;margin:0 0 8px}.actionRow{border:1px solid #d8e1eb;border-radius:7px;padding:9px;margin:6px 0}.actionRow strong{color:#0c72df}.actionRow code{display:block;font-size:11px;color:#64748b;word-break:break-all;margin-top:4px}.json{background:#101827;color:#c7f9d4;padding:14px;border-radius:7px;max-height:390px;overflow:auto;font:11px ui-monospace,monospace;white-space:pre-wrap}.toolbar .grow{flex:1}@media(max-width:820px){.grid{grid-template-columns:1fr}.device{max-width:430px;margin:auto}.card{min-height:660px}}
</style></head>
<body><header class="top"><h1>AAA Wallet Pass Inspector</h1><p>Read-only pass preview, actions, and complete metadata</p></header>
<main class="wrap"><nav class="toolbar"><button class="active" data-pass="membership">Membership</button><button data-pass="insurance">Insurance</button><label>Import pass.json<input id="jsonFile" type="file" accept=".json,application/json"></label><label>Import template folder<input id="folder" type="file" webkitdirectory multiple></label><span class="grow"></span><button id="front" class="active">Front</button><button id="details">Details</button><button id="ios27" class="active">iOS 27</button><button id="ios26">iOS 26</button></nav>
<section class="grid"><div class="device" id="device"><div id="card" class="card"><div class="face"><div class="phone"><div class="screen"><div id="hero" class="hero"><span class="brand">AAA</span><span id="heroTitle" class="heroTitle"></span></div><div id="fields" class="fields"></div><div id="actions" class="actions"></div></div></div></div><div class="face back"><div class="phone"><div id="back" class="backScreen"></div></div></div></div></div>
<aside class="panel"><h2 id="passName">Loading pass…</h2><div id="summary" class="muted"></div><section class="section"><h3>Featured Actions</h3><div id="actionList"></div><p class="muted">Wallet provides each action’s icon and display label according to its supported type.</p></section><section class="section"><h3>Complete pass.json metadata</h3><pre id="json" class="json">Loading…</pre></section></aside></section></main>
<script>
const defaults={membership:{json:'templates/AAA Membership Card.pkpasstemplate/pass.json',art:'templates/AAA Membership Card.pkpasstemplate/artwork@3x.png'},insurance:{json:'templates/AAA Insurance Card.pkpasstemplate/pass.json',art:'templates/AAA Insurance Card.pkpasstemplate/artwork@3x.png'}};
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionTypes={call:['☎','Call'],place:['⌖','Go to Location'],membershipBenefits:['★','View Membership Benefits'],shop:['▣','Shop Online or In-App'],order:['▰','Order Delivery or Pickup'],bookAppointment:['◷','Book an Appointment'],viewOffersRewards:['★','View Offers & Rewards'],bookCar:['▣','Book a Car'],bookFlight:['✈','Book a Flight'],bookStay:['⌂','Book a Stay'],viewSchedule:['◷','View Schedule'],watchTrailer:['▶','Watch Trailer'],listenToMusic:['♫','Listen to Music'],addToBalance:['＋','Add to Balance']};
let selected='membership',passData=null,artworkURL='';
function actionDestination(action){return action.url||action.placeIdentifier||''}
function showError(message){$('passName').textContent='Could not load pass';$('summary').textContent=message;$('json').textContent=message}
function render(){const style=passData.posterGeneric||passData.generic||{},actions=passData.featuredActions||[];$('passName').textContent=passData.description||'Wallet Pass';$('summary').textContent=(passData.posterGeneric?'Poster Generic':'Generic')+' · format '+(passData.formatVersion??'unknown')+' · '+actions.length+' Featured Actions';$('hero').style.backgroundImage=`url("${artworkURL||defaults[selected].art}")`;$('heroTitle').innerHTML=(style.headerFields||[]).map(field=>esc(field.value)+(field.label?'<small>'+esc(field.label)+'</small>':'')).join('');$('fields').innerHTML=(style.primaryFields||[]).map(field=>'<div class="field"><label>'+esc(field.label)+'</label><strong>'+esc(field.value)+'</strong></div>').join('')+(passData.barcodes?.length?'<div class="barcode" aria-label="Barcode"></div>':'');$('actions').innerHTML=actions.map(action=>{const display=actionTypes[action.type]||['●',action.type||'Action'];return '<div class="action"><b>'+display[0]+'</b>'+esc(display[1])+'</div>'}).join('');$('actionList').innerHTML=actions.map(action=>{const display=actionTypes[action.type]||['●',action.type||'Action'];return '<div class="actionRow"><strong>'+display[0]+' '+esc(display[1])+'</strong><br><small>Type: '+esc(action.type)+' · Identifier: '+esc(action.identifier)+'</small><code>'+esc(actionDestination(action))+'</code></div>'}).join('')||'<span class="muted">No Featured Actions in this pass.</span>';$('back').innerHTML='<h3>Pass Details</h3>'+(style.backFields||[]).map(field=>'<div class="backField"><b>'+esc(field.label)+'</b>'+esc(field.value)+'</div>').join('');$('json').textContent=JSON.stringify(passData,null,2)}
const posterLayout=document.createElement('style');posterLayout.textContent='.screen{position:relative}.hero{height:auto;aspect-ratio:358/448;background-size:100% 100%}.hero:after{display:none}.heroTitle{display:none}.fields{position:absolute;z-index:2;left:12px;right:12px;top:64%;margin:0;padding:5px 10px;background:#fff;border-radius:0}.barcode{height:42px;margin:0 auto 7px}.fields:after{content:attr(data-footer);display:block;margin-top:5px;font-size:9px;color:#404040}.device{cursor:grab}.device:active{cursor:grabbing}';document.head.append(posterLayout);const originalRender=render;render=function(){originalRender();const fields=$('fields'),barcode=fields.querySelector('.barcode');if(barcode)fields.insertBefore(barcode,fields.firstChild);const footer=(passData.posterGeneric||passData.generic||{}).footerFields||[];fields.dataset.footer=footer.map(field=>field.value).filter(Boolean).join(' · ')};
async function loadDefault(){try{const response=await fetch(defaults[selected].json);if(!response.ok)throw new Error('Template data request failed ('+response.status+').');passData=await response.json();artworkURL='';render()}catch(error){showError(error.message+' Try reloading the page.')}}
document.querySelectorAll('[data-pass]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-pass]').forEach(item=>item.classList.remove('active'));button.classList.add('active');selected=button.dataset.pass;loadDefault()}));
function flip(toBack){$('card').classList.toggle('flip',toBack);$('front').classList.toggle('active',!toBack);$('details').classList.toggle('active',toBack)}$('front').addEventListener('click',()=>flip(false));$('details').addEventListener('click',()=>flip(true));$('ios27').addEventListener('click',()=>{$('ios27').classList.add('active');$('ios26').classList.remove('active')});$('ios26').addEventListener('click',()=>{$('ios26').classList.add('active');$('ios27').classList.remove('active')});
let pointerStart=null;const device=$('device'),card=$('card');device.addEventListener('pointerdown',event=>{pointerStart={x:event.clientX,y:event.clientY};card.style.transition='none';device.setPointerCapture(event.pointerId)});device.addEventListener('pointermove',event=>{if(!pointerStart)return;const dx=event.clientX-pointerStart.x,dy=event.clientY-pointerStart.y,base=card.classList.contains('flip')?180:0;card.style.transform='rotateY('+(base+dx*.55)+'deg) rotateX('+(-dy*.12)+'deg)'});device.addEventListener('pointerup',event=>{if(!pointerStart)return;const dx=event.clientX-pointerStart.x,dy=event.clientY-pointerStart.y;pointerStart=null;card.style.transition='transform .55s';if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))flip(dx<0);else card.style.transform=''});device.addEventListener('pointercancel',()=>{pointerStart=null;card.style.transition='transform .55s';card.style.transform=''});
$('jsonFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{passData=JSON.parse(await file.text());selected='membership';artworkURL='';render()}catch{showError('The selected file is not valid pass.json.')}});$('folder').addEventListener('change',async event=>{const files=[...event.target.files],jsonFile=files.find(file=>file.name==='pass.json');if(!jsonFile){showError('Select the complete .pkpasstemplate folder. It must include pass.json.');return}try{passData=JSON.parse(await jsonFile.text());const image=files.find(file=>/artwork@3x\.png$/i.test(file.name));artworkURL=image?URL.createObjectURL(image):'';selected='membership';render()}catch{showError('The selected template contains invalid JSON.')}});
loadDefault();
</script></body></html>
