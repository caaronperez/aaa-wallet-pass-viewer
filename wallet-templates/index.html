<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wallet Templates</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --accent: #0c72df;
        --bad-bg: #fdecec;
        --bad: #b3261e;
        --ok: #1e7b34;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #121317;
          --surface: #1d1e23;
          --text: #ececf0;
          --muted: #a1a2ab;
          --line: #2f3038;
          --accent: #3d8ef0;
          --bad-bg: #3a1d1d;
          --bad: #ff8a80;
          --ok: #6fd18a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 -apple-system,
          system-ui,
          sans-serif;
      }
      .lock {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 19px;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0 6px;
      }
      input,
      select {
        width: 100%;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      #code {
        font-size: 22px;
        letter-spacing: 6px;
        text-align: center;
      }
      button,
      .button {
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .card button[type='submit'] {
        width: 100%;
        margin-top: 16px;
      }
      .error {
        min-height: 18px;
        margin: 8px 0 0;
        color: var(--bad);
        font-size: 12.5px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        padding: 12px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        flex: 1 1 auto;
      }
      header .meta {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        padding: 16px;
      }
      .rows {
        display: grid;
        gap: 10px;
      }
      .row {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .row.bad {
        border-color: var(--bad);
        background: var(--bad-bg);
      }
      .row .top {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
      }
      .row .state {
        font-weight: 700;
        font-size: 17px;
      }
      .small {
        color: var(--muted);
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }
      .issue {
        color: var(--bad);
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }
      .fits {
        color: var(--ok);
        font-size: 12.5px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .actions button.wallet {
        background: #000;
        color: #fff;
      }
      .actions button {
        padding: 7px 10px;
        font-size: 13px;
      }
      pre {
        margin: 6px 0 0;
        padding: 10px;
        background: var(--bg);
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
        max-height: 360px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar select {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var ACCESS_URL = 'https://aaa-wallet-templates-access.caaronperez.workers.dev';
        var SESSION_KEY = 'awtSession';
        var EXPIRED_MESSAGE = 'Your 30 minutes ended. Enter the password and a new code.';
        var root = document.getElementById('root');
        var lockTimer = null;
        var objectUrls = [];
        var encoder = new TextEncoder();

        function el(tag, attrs, children) {
          var node = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (key) {
            if (key === 'text') node.textContent = attrs[key];
            else if (key.indexOf('on') === 0) node.addEventListener(key.slice(2), attrs[key]);
            else node.setAttribute(key, attrs[key]);
          });
          (children || []).forEach(function (child) {
            if (child) node.appendChild(child);
          });
          return node;
        }

        function callAccess(path, body) {
          return fetch(ACCESS_URL + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }).then(function (response) {
            return response.json().then(
              function (data) {
                return { ok: response.ok, data: data };
              },
              function () {
                return { ok: false, data: {} };
              }
            );
          });
        }

        function base64Bytes(text) {
          var binary = atob(text),
            bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return bytes;
        }

        function decryptPayload(keyBase64) {
          return Promise.all([
            crypto.subtle.importKey('raw', base64Bytes(keyBase64), 'AES-GCM', false, ['decrypt']),
            fetch('data.bin', { cache: 'no-store' }).then(function (response) {
              if (!response.ok) throw new Error('missing');
              return response.arrayBuffer();
            })
          ])
            .then(function (results) {
              var bytes = new Uint8Array(results[1]);
              return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, results[0], bytes.slice(12));
            })
            .then(function (gzipped) {
              return new Response(new Blob([gzipped]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
            });
        }

        function savedSession() {
          try {
            var session = JSON.parse(localStorage.getItem(SESSION_KEY));
            return session && session.expiresAt > Date.now() ? session : null;
          } catch (e) {
            return null;
          }
        }

        function unlockedUntil() {
          var session = savedSession();
          return session ? session.expiresAt : 0;
        }

        function lock(message) {
          clearTimeout(lockTimer);
          try {
            localStorage.removeItem(SESSION_KEY);
          } catch (e) {}
          objectUrls.forEach(URL.revokeObjectURL);
          objectUrls = [];
          showPassword(message);
        }

        function scheduleLock() {
          clearTimeout(lockTimer);
          lockTimer = setTimeout(
            function () {
              lock(EXPIRED_MESSAGE);
            },
            Math.max(0, unlockedUntil() - Date.now())
          );
        }

        ['visibilitychange', 'focus'].forEach(function (event) {
          window.addEventListener(event, function () {
            if (root.querySelector('header') && Date.now() >= unlockedUntil()) lock(EXPIRED_MESSAGE);
          });
        });

        function openWith(key) {
          return decryptPayload(key).then(render, function () {
            lock('The page and the access service use different keys. Export the page again.');
          });
        }

        function showForm(title, text, fields, submitText, onSubmit, extra) {
          root.textContent = '';
          var error = el('p', { class: 'error', role: 'alert' });
          var submit = el('button', { type: 'submit', text: submitText });
          var form = el(
            'form',
            { class: 'card' },
            [el('h1', { text: title }), el('p', { text: text })].concat(fields, [error, submit, extra])
          );
          form.addEventListener('submit', function (event) {
            event.preventDefault();
            onSubmit(submit, error);
          });
          root.appendChild(el('div', { class: 'lock' }, [form]));
          return error;
        }

        function showPassword(message) {
          var input = el('input', { id: 'password', type: 'password', autocomplete: 'current-password', required: '' });
          var error = showForm(
            'Wallet Templates',
            'Enter the viewer password.',
            [el('label', { for: 'password', text: 'Password' }), input],
            'Next',
            function () {
              showCode(input.value);
            }
          );
          error.textContent = message || '';
          input.focus();
        }

        function showCode(password) {
          var input = el('input', {
            id: 'code',
            inputmode: 'numeric',
            autocomplete: 'one-time-code',
            pattern: '[0-9]{6}',
            maxlength: '6',
            required: ''
          });
          var back = el('p', { style: 'margin:14px 0 0' }, [
            el('button', {
              type: 'button',
              class: 'secondary',
              text: 'Back',
              onclick: function () {
                showPassword();
              }
            })
          ]);
          showForm(
            'Wallet Templates',
            'Enter the 6-digit code from the Passwords app. Access lasts 30 minutes.',
            [el('label', { for: 'code', text: '6-digit code' }), input],
            'Unlock',
            function (submit, error) {
              submit.disabled = true;
              callAccess('/unlock', { password: password, code: input.value.replace(/\D/g, '') })
                .then(function (response) {
                  if (response.ok) {
                    try {
                      localStorage.setItem(
                        SESSION_KEY,
                        JSON.stringify({ token: response.data.token, expiresAt: response.data.expiresAt })
                      );
                    } catch (e) {}
                    return openWith(response.data.key);
                  }
                  submit.disabled = false;
                  var reason = response.data.error;
                  if (reason === 'password') return showPassword('Wrong password.');
                  error.textContent =
                    reason === 'code'
                      ? 'Wrong code. Try again.'
                      : reason === 'reused'
                        ? 'That code was already used. Wait for the next one.'
                        : reason === 'blocked'
                          ? 'Too many wrong tries. Try again in ' + Math.ceil(response.data.retryAfter / 60) + ' min.'
                          : 'Could not unlock. Try again.';
                  input.select();
                })
                .catch(function () {
                  submit.disabled = false;
                  error.textContent = 'Could not reach the access service. Check your connection.';
                });
            },
            back
          );
          input.focus();
        }

        var crcTable = (function () {
          var table = [];
          for (var n = 0; n < 256; n++) {
            var c = n;
            for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            table[n] = c >>> 0;
          }
          return table;
        })();
        function crc32(bytes) {
          var crc = 0xffffffff;
          for (var i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 255] ^ (crc >>> 8);
          return (crc ^ 0xffffffff) >>> 0;
        }
        function zip(files) {
          var parts = [],
            central = [],
            offset = 0;
          files.forEach(function (file) {
            var name = encoder.encode(file.path),
              data = file.data,
              crc = crc32(data);
            var local = new DataView(new ArrayBuffer(30));
            local.setUint32(0, 0x04034b50, true);
            local.setUint16(4, 20, true);
            local.setUint16(6, 0x0800, true);
            local.setUint32(14, crc, true);
            local.setUint32(18, data.length, true);
            local.setUint32(22, data.length, true);
            local.setUint16(26, name.length, true);
            var entry = new DataView(new ArrayBuffer(46));
            entry.setUint32(0, 0x02014b50, true);
            entry.setUint16(4, 20, true);
            entry.setUint16(6, 20, true);
            entry.setUint16(8, 0x0800, true);
            entry.setUint32(16, crc, true);
            entry.setUint32(20, data.length, true);
            entry.setUint32(24, data.length, true);
            entry.setUint16(28, name.length, true);
            entry.setUint32(42, offset, true);
            parts.push(local, name, data);
            central.push(entry, name);
            offset += 30 + name.length + data.length;
          });
          var size = central.reduce(function (total, part) {
            return total + part.byteLength;
          }, 0);
          var end = new DataView(new ArrayBuffer(22));
          end.setUint32(0, 0x06054b50, true);
          end.setUint16(8, files.length, true);
          end.setUint16(10, files.length, true);
          end.setUint32(12, size, true);
          end.setUint32(16, offset, true);
          return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
        }

        function blobBytes(payload, id) {
          var binary = atob(payload.blobs[id]),
            bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return bytes;
        }

        function download(name, blob) {
          var url = URL.createObjectURL(blob);
          objectUrls.push(url);
          var link = el('a', { href: url, download: name });
          document.body.appendChild(link);
          link.click();
          link.remove();
        }

        function downloadPass(payload, name, templateFiles, artworkFiles, row, legacy) {
          var folder = name + (legacy ? ' legacy' : '') + '.pkpasstemplate/';
          var files = Object.assign({}, templateFiles, legacy ? {} : artworkFiles);
          var entries = Object.keys(files)
            .filter(function (file) {
              return !(legacy && payload.posterOnlyFiles.indexOf(file) >= 0);
            })
            .map(function (file) {
              return { path: folder + file, data: blobBytes(payload, files[file]) };
            });
          entries.push({
            path: folder + 'pass.json',
            data: encoder.encode(JSON.stringify(legacy ? row.legacy : row.design, null, 2))
          });
          download(folder.slice(0, -1) + '.zip', zip(entries));
        }

        function downloadTemplate(payload, fixture, info, legacy) {
          downloadPass(
            payload,
            info.state + ' ' + info.club + ' ' + fixture,
            payload.templates[info.variant],
            payload.artwork[info.club],
            payload.rows[fixture][info.state],
            legacy
          );
        }

        function downloadMembership(payload, row, legacy) {
          downloadPass(
            payload,
            'Membership ' + row.club,
            payload.templates.membership,
            payload.membershipArtwork[row.club],
            row,
            legacy
          );
        }

        function addToWallet(button, id) {
          var session = savedSession();
          if (!session) return lock(EXPIRED_MESSAGE);
          button.disabled = true;
          callAccess('/pass-link', { token: session.token, id: id })
            .then(function (response) {
              button.disabled = false;
              if (response.ok) {
                window.location.href = response.data.url;
              } else if (response.data.error === 'expired') {
                lock(EXPIRED_MESSAGE);
              } else {
                button.textContent = 'Pass not available';
              }
            })
            .catch(function () {
              button.disabled = false;
              button.textContent = 'Try again';
            });
        }

        function render(payload) {
          root.textContent = '';
          var fixture = payload.fixtures[0];
          var card = 'insurance';
          var rowsNode = el('div', { class: 'rows' });
          var cardSelect = el(
            'select',
            {
              'aria-label': 'Card',
              onchange: function () {
                card = cardSelect.value;
                fixtureLabel.hidden = select.hidden = card !== 'insurance';
                fill();
              }
            },
            [
              el('option', { value: 'insurance', text: 'Insurance (by state)' }),
              payload.membership ? el('option', { value: 'membership', text: 'Membership (by club)' }) : null
            ]
          );
          var fixtureLabel = el('label', { text: 'Policy fixture', style: 'margin:0' });
          var select = el(
            'select',
            {
              'aria-label': 'Policy fixture',
              onchange: function () {
                fixture = select.value;
                fill();
              }
            },
            payload.fixtures.map(function (name) {
              return el('option', { value: name, text: name });
            })
          );
          var until = new Date(unlockedUntil());
          root.appendChild(
            el('header', {}, [
              el('h1', { text: 'Wallet Templates' }),
              el('span', {
                class: 'meta',
                text: 'Locks at ' + until.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
              }),
              el('button', {
                class: 'secondary',
                text: 'Lock now',
                onclick: function () {
                  lock('Locked.');
                }
              })
            ])
          );
          root.appendChild(
            el('main', {}, [
              el('div', { class: 'toolbar' }, [
                el('label', { text: 'Card', style: 'margin:0' }),
                cardSelect,
                fixtureLabel,
                select
              ]),
              el('p', {
                text:
                  'Exported ' +
                  new Date(payload.generatedAt).toLocaleString() +
                  '. "Add to Apple Wallet" installs the signed pass (open this page in Safari on your iPhone). "New design" and "Legacy" download a .pkpasstemplate folder (zipped) for Pass Designer; Legacy is what iOS < 26 shows.'
              }),
              rowsNode
            ])
          );

          function walletButton(id) {
            return id
              ? el('button', {
                  class: 'wallet',
                  text: 'Add to Apple Wallet',
                  onclick: function (event) {
                    addToWallet(event.currentTarget, id);
                  }
                })
              : null;
          }

          function issuesView(issues) {
            return issues.length
              ? el(
                  'div',
                  {},
                  issues.map(function (issue) {
                    return el('div', { class: 'issue', text: issue });
                  })
                )
              : el('div', { class: 'fits', text: '✓ every value fits' });
          }

          function fillMembership() {
            payload.membership.forEach(function (row) {
              var values = row.values;
              var valuesView = el('pre', { hidden: '', text: JSON.stringify(values, null, 2) });
              rowsNode.appendChild(
                el('div', { class: 'row' + (row.issues.length ? ' bad' : '') }, [
                  el('div', { class: 'top' }, [
                    el('span', { class: 'state', text: 'Club ' + row.club }),
                    el('span', { class: 'small', text: 'membership' })
                  ]),
                  el('div', { text: values.memberName.value + ' · ' + values.cardTitle.value }),
                  el('div', {
                    class: 'small',
                    text: [
                      'Valid through ' + values.validThru.value,
                      values.memberSince && values.memberSince.value,
                      values.roadsidePhone.value
                    ]
                      .filter(Boolean)
                      .join(' · ')
                  }),
                  el('div', { class: 'small', text: 'Membership number ' + values.membershipNumber.value }),
                  issuesView(row.issues),
                  el('div', { class: 'actions' }, [
                    walletButton(row.passId),
                    el('button', {
                      text: 'New design',
                      onclick: function () {
                        downloadMembership(payload, row, false);
                      }
                    }),
                    el('button', {
                      text: 'Legacy (iOS < 26)',
                      onclick: function () {
                        downloadMembership(payload, row, true);
                      }
                    }),
                    el('button', {
                      class: 'secondary',
                      text: 'Values',
                      onclick: function () {
                        valuesView.hidden = !valuesView.hidden;
                      }
                    })
                  ]),
                  valuesView
                ])
              );
            });
          }

          function fill() {
            rowsNode.textContent = '';
            if (card === 'membership') return fillMembership();
            payload.states.forEach(function (info) {
              var row = payload.rows[fixture][info.state],
                values = row.values;
              var valuesView = el('pre', { hidden: '', text: JSON.stringify(values, null, 2) });
              rowsNode.appendChild(
                el('div', { class: 'row' + (row.issues.length ? ' bad' : '') }, [
                  el('div', { class: 'top' }, [
                    el('span', { class: 'state', text: info.state }),
                    el('span', { class: 'small', text: 'club ' + info.club + ' · ' + info.variant })
                  ]),
                  el('div', { text: info.frontTitle + (info.legacyTitle ? ' · legacy: ' + info.legacyTitle : '') }),
                  el('div', {
                    class: 'small',
                    text: [values.namedInsured, values.policyNumber, values.effective]
                      .map(function (field) {
                        return field ? field.value : '';
                      })
                      .join(' · ')
                  }),
                  el('div', {
                    class: 'small',
                    text: values.insuranceCompanyFooter ? values.insuranceCompanyFooter.value : ''
                  }),
                  row.issues.length
                    ? el(
                        'div',
                        {},
                        row.issues.map(function (issue) {
                          return el('div', { class: 'issue', text: issue });
                        })
                      )
                    : el('div', { class: 'fits', text: '✓ every value fits' }),
                  el('div', { class: 'actions' }, [
                    walletButton(payload.passIds && payload.passIds[fixture][info.state]),
                    el('button', {
                      text: 'New design',
                      onclick: function () {
                        downloadTemplate(payload, fixture, info, false);
                      }
                    }),
                    el('button', {
                      text: 'Legacy (iOS < 26)',
                      onclick: function () {
                        downloadTemplate(payload, fixture, info, true);
                      }
                    }),
                    el('button', {
                      class: 'secondary',
                      text: 'Values',
                      onclick: function () {
                        valuesView.hidden = !valuesView.hidden;
                      }
                    })
                  ]),
                  valuesView
                ])
              );
            });
          }
          fill();
          scheduleLock();
        }

        var saved = savedSession();
        if (!saved) {
          showPassword();
        } else {
          callAccess('/session', { token: saved.token })
            .then(function (response) {
              if (response.ok) return openWith(response.data.key);
              lock(EXPIRED_MESSAGE);
            })
            .catch(function () {
              lock('Could not reach the access service. Check your connection.');
            });
        }
      })();
    </script>
  </body>
</html>
